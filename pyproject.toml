[project]
name = "cs-pilot"
version = "0.1.0"
description = "Policy-grounded CS assistant learning project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-chroma>=1,<2",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
